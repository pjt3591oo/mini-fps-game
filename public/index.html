<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPS Arena</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --amber: #ffb224; --cyan: #4fd8ff; --red: #ff4d3d; --green: #5fe07a;
    --text: #eef3f8; --dim: rgba(238,243,248,.62);
    --panel: rgba(8,12,18,.66); --line: rgba(255,255,255,.16);
    --num: "Rajdhani", "Noto Sans KR", system-ui, sans-serif;
    --cut: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05080d; user-select: none;
    font-family: "Noto Sans KR", system-ui, "Malgun Gothic", sans-serif; color: var(--text); }
  canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.8); }
  #hud.hidden { display: none; }
  b, kbd { font-weight: 700; }

  /* ---------- 조준선 / 히트마커 ---------- */
  #cross { position: absolute; left: 50%; top: 50%; }
  #cross i { position: absolute; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.55); border-radius: 1px; }
  #cross .t, #cross .b { width: 2px; height: 9px; left: -1px; }
  #cross .l, #cross .r { height: 2px; width: 9px; top: -1px; }
  #cross .dot { width: 2px; height: 2px; left: -1px; top: -1px; }
  #hitmark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); opacity: 0; filter: drop-shadow(0 0 2px rgba(0,0,0,.8)); }
  #hitmark line { stroke: #fff; stroke-width: 2.5; stroke-linecap: round; }
  #hitmark.head line { stroke: var(--amber); }
  #hitmark.kill line { stroke: var(--red); stroke-width: 3.5; }

  /* ---------- 저격 조준경 ---------- */
  #scope { position: absolute; inset: 0; display: none;
    background: radial-gradient(circle at center, transparent 0, transparent 33vh, rgba(0,0,0,.55) 33.6vh, #000 35.5vh); }
  #scope::before, #scope::after { content: ""; position: absolute; background: rgba(10,10,10,.9); }
  #scope::before { left: calc(50% - .5px); top: calc(50% - 34vh); width: 1px; height: 68vh; }
  #scope::after { top: calc(50% - .5px); left: calc(50% - 34vh); height: 1px; width: 68vh; }
  #scope i { position: absolute; left: 50%; top: 50%; width: 22vh; height: 22vh; margin: -11vh 0 0 -11vh; border: 1px solid rgba(10,10,10,.5); border-radius: 50%; }

  /* ---------- 피격 ---------- */
  #hurt { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 42%, rgba(210,20,10,.8) 100%); opacity: 0; }
  #hurtdir { position: absolute; left: 50%; top: 50%; width: 0; height: 0; opacity: 0; }
  #hurtdir::before { content: ""; position: absolute; left: -80px; top: -200px; width: 160px; height: 30px;
    background: radial-gradient(ellipse at 50% 100%, rgba(255,60,40,.95), transparent 70%); border-radius: 50%; }

  /* ---------- 상단 중앙 ---------- */
  #top { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch;
    background: var(--panel); border: 1px solid var(--line); clip-path: var(--cut); font-size: 13px; color: var(--dim); white-space: nowrap; }
  #top span { padding: 6px 16px 5px; border-left: 1px solid var(--line); display: flex; align-items: baseline; gap: 7px; }
  #top span:first-child { border-left: 0; }
  #top b { font-family: var(--num); font-size: 22px; color: var(--text); line-height: 1; }
  #top .wv { color: var(--amber); letter-spacing: 2px; font-family: var(--num); font-weight: 600; font-size: 15px; }
  #top .wv b { color: var(--amber); }
  #top .cr b { color: var(--cyan); }
  #top .mut { color: #10141a; background: var(--amber); font-weight: 700; align-items: center; text-shadow: none; }
  #combo { position: absolute; top: 60px; left: 0; right: 0; text-align: center; font-family: var(--num); font-size: 26px; font-weight: 700; color: var(--amber); opacity: 0; letter-spacing: 1px; }
  #bossbar { position: absolute; top: 98px; left: 50%; transform: translateX(-50%); width: 44vw; display: none; text-align: center; font-size: 14px; font-weight: 700; letter-spacing: 4px; color: #ffd9d2; }
  #bossbar > div { height: 10px; margin-top: 5px; background: rgba(0,0,0,.6); border: 1px solid rgba(255,120,100,.55); transform: skewX(-18deg); overflow: hidden; }
  #bossfill { height: 100%; background: linear-gradient(90deg, #ff3b30, #ff9a3c); width: 100%; box-shadow: 0 0 12px rgba(255,80,40,.8); }
  #buff { position: absolute; top: 134px; left: 0; right: 0; text-align: center; font-size: 16px; font-weight: 700; color: var(--cyan); }
  #markers i { position: absolute; left: -9px; top: -9px; width: 0; height: 0; display: none; border-left: 9px solid transparent; border-right: 9px solid transparent; border-bottom: 16px solid var(--red); filter: drop-shadow(0 0 2px #000); }
  #prompt { position: absolute; left: 50%; top: 60%; transform: translateX(-50%); display: none; text-align: center; font-size: 16px; font-weight: 700; }
  #prompt > div { width: 220px; height: 6px; margin: 7px auto 0; background: rgba(0,0,0,.6); border: 1px solid var(--line); }
  #promptfill { height: 100%; width: 0; background: var(--green); }

  /* ---------- 배너 ---------- */
  #banner { position: absolute; top: 25%; left: 0; right: 0; text-align: center; opacity: 0; transition: opacity .35s; }
  #banner.show { opacity: 1; }
  #banner.show b { animation: bannerIn .45s cubic-bezier(.2,.9,.3,1.2); }
  #banner b { display: inline-block; position: relative; font-family: var(--num); font-size: 58px; font-weight: 700; letter-spacing: 6px; line-height: 1.1; padding: 0 28px; }
  #banner b::before, #banner b::after { content: ""; position: absolute; top: 50%; width: 120px; height: 2px; background: linear-gradient(90deg, transparent, var(--amber)); }
  #banner b::before { right: 100%; }
  #banner b::after { left: 100%; transform: scaleX(-1); }
  #banner span { display: block; margin-top: 6px; font-size: 18px; color: var(--dim); }
  @keyframes bannerIn { from { transform: scale(1.25); letter-spacing: 16px; opacity: 0; } to { transform: scale(1); opacity: 1; } }

  /* ---------- 우측 상단: 미니맵 / 킬 피드 ---------- */
  #mapwrap { position: absolute; right: 16px; top: 16px; padding: 4px; background: var(--panel); border: 1px solid var(--line); clip-path: var(--cut); }
  #minimap { display: block; width: 170px; height: 170px; }
  #feed { position: absolute; right: 16px; top: 206px; text-align: right; font-size: 13px; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  #feed div { padding: 3px 10px; background: rgba(8,12,18,.55); border-right: 2px solid var(--line); color: var(--dim); transition: opacity .5s; }
  #feed div.mine { color: var(--text); border-right-color: var(--amber); }
  #players { position: absolute; left: 16px; top: 16px; font-size: 13px; display: flex; flex-direction: column; gap: 3px; }
  #players div { padding: 3px 10px; background: rgba(8,12,18,.55); border-left: 2px solid var(--cyan); }
  #players .dead { opacity: .5; text-decoration: line-through; border-left-color: var(--red); }

  /* ---------- 좌측 하단: 체력 ---------- */
  #stats { position: absolute; left: 22px; bottom: 20px; }
  #hpbox { display: flex; align-items: flex-end; gap: 10px; }
  #hpbox label { padding-bottom: 9px; }
  #hptext { font-family: var(--num); font-size: 52px; font-weight: 700; line-height: .95; }
  #hptext small { font-size: 20px; font-weight: 600; color: var(--dim); margin-left: 6px; }
  #hpbar { width: 250px; height: 10px; margin-top: 6px; background: rgba(0,0,0,.55); border: 1px solid var(--line); transform: skewX(-18deg); overflow: hidden; position: relative; }
  #hpbar::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(90deg, transparent 0 23px, rgba(0,0,0,.65) 23px 25px); }
  #hpfill { height: 100%; width: 100%; background: var(--green); transition: width .12s; }
  #dash { margin-top: 9px; font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 8px; }
  #dash kbd, #wlist kbd { font-family: var(--num); font-size: 12px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; background: rgba(0,0,0,.4); color: var(--text); }
  #dashbar { width: 96px; height: 4px; background: rgba(0,0,0,.55); border: 1px solid var(--line); transform: skewX(-18deg); }
  #dashfill { height: 100%; width: 100%; background: var(--cyan); }
  #items { margin-top: 8px; display: flex; gap: 4px; }
  #items span { font-size: 12px; padding: 3px 7px; background: rgba(8,12,18,.6); border: 1px solid var(--line); display: flex; gap: 6px; align-items: center; text-shadow: none; }
  #items span.none { opacity: .38; }
  #items kbd { font-family: var(--num); font-size: 12px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; background: rgba(0,0,0,.4); }
  #items b { font-family: var(--num); font-size: 15px; color: var(--cyan); }
  #inter { position: absolute; left: 50%; bottom: 64px; transform: translateX(-50%); display: none; font-size: 14px; color: var(--dim); padding: 6px 14px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
  #inter kbd { font-family: var(--num); font-size: 13px; padding: 0 6px; margin: 0 4px 0 8px; border: 1px solid var(--amber); color: var(--amber); border-radius: 3px; }
  #inter kbd:first-child { margin-left: 0; }
  #inter em { font-style: normal; margin-left: 14px; padding-left: 12px; border-left: 1px solid var(--line); }
  #inter em b { font-family: var(--num); font-size: 17px; color: var(--amber); margin-right: 2px; }
  #actmsg { position: absolute; left: 50%; top: calc(50% + 46px); transform: translateX(-50%); padding: 5px 14px; font-size: 14px; background: var(--panel); border-left: 3px solid var(--red); opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #actmsg.show { opacity: 1; }
  body.shopping #perks, body.shopping #perkhint, body.shopping #perkbar, body.shopping #hint { display: none !important; }
  #shoptime { font-size: 12.5px; color: var(--dim); }
  .wcard > button.sure { margin-top: 5px; padding: 5px 10px; background: rgba(79,216,255,.08); border-color: rgba(79,216,255,.5); }
  .wcard > button.sure .lbl { font-size: 12.5px; }
  .wcard > button.sure:hover:not(:disabled) { background: rgba(79,216,255,.22); }

  /* ---------- 그림 요소 공통 ---------- */
  #hud svg, #overlay svg { display: block; flex: none; }
  #top svg { width: 15px; height: 15px; align-self: center; }
  #top .wv svg { color: var(--amber); }
  #top .en svg { color: #ff8a7a; } #top .sc svg { color: #ffe08a; } #top .cr svg { color: var(--cyan); }
  #hpico svg { width: 26px; height: 26px; color: var(--green); filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); }
  #hud.shielded #hpico svg { color: var(--cyan); }
  #hud.shielded::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 90px rgba(79,216,255,.45); pointer-events: none; }
  #dashico svg { width: 14px; height: 14px; color: var(--cyan); }
  #bossico { display: inline-block; vertical-align: -4px; margin-right: 6px; }
  #bossico svg { width: 18px; height: 18px; color: #ff8a7a; }
  #hint { display: flex; align-items: center; gap: 10px; text-align: left; }
  #hint svg { width: 20px; height: 20px; color: var(--amber); }
  #feed div { display: flex; align-items: center; gap: 6px; }
  #feed svg { width: 14px; height: 14px; }
  #feed div.mine svg { color: var(--amber); }
  #inter svg { display: inline-block; width: 15px; height: 15px; vertical-align: -3px; margin-right: 4px; color: var(--text); }
  #buff { display: flex; justify-content: center; gap: 10px; }
  #buff span { display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 8px; font-size: 13px; background: var(--panel); border: 1px solid currentColor; }
  #buff svg { width: 18px; height: 18px; }
  #buff b { font-family: var(--num); font-size: 20px; line-height: 1; }
  #buff .amp { color: #ffb224; } #buff .sh { color: var(--cyan); }
  /* 아이템 타일 */
  #items span { position: relative; width: 44px; height: 44px; padding: 0; justify-content: center; --c: var(--green); color: var(--c); border-color: color-mix(in srgb, var(--c) 55%, transparent); }
  #items span.shield { --c: var(--cyan); } #items span.strike { --c: #ff7a52; }
  #items svg { width: 26px; height: 26px; }
  #items kbd { position: absolute; left: -1px; top: -1px; border-radius: 0; font-size: 11px; color: var(--text); }
  #items b { position: absolute; right: 3px; bottom: 0; font-size: 15px; color: var(--text); }
  /* 특성 아이콘 */
  #perklist span { position: relative; width: 28px; height: 28px; padding: 0; display: grid; place-items: center; color: var(--text); }
  #perklist svg { width: 18px; height: 18px; }
  #perklist b { position: absolute; right: -4px; bottom: -5px; font-family: var(--num); font-size: 12px; padding: 0 3px; background: #11151b; border: 1px solid var(--line); line-height: 1.1; }
  .perk .pico { width: 52px; height: 52px; margin: 12px 0 2px; display: grid; place-items: center; color: #c9d2dc; background: rgba(255,255,255,.06); border: 1px solid var(--line); }
  .perk .pico svg { width: 32px; height: 32px; }
  .perk.rare .pico { color: var(--amber); border-color: rgba(255,178,36,.6); background: rgba(255,178,36,.1); }
  .perk h3 { margin-top: 8px; }
  /* 무기 슬롯: 실루엣 */
  #wlist span { position: relative; padding: 4px 8px 4px 6px; }
  svg.gs { width: 52px; height: 21px; fill: currentColor; }
  #wlist span.on svg.gs { fill: #11151b; }
  #wlist em { position: absolute; right: 2px; top: -9px; font-style: normal; font-family: var(--num); font-size: 12px; font-weight: 700; color: var(--amber); text-shadow: 0 1px 2px #000; }
  /* 수류탄 */
  #nades kbd { font-family: var(--num); font-size: 11px; padding: 0 5px; border: 1px solid var(--line); border-radius: 3px; background: rgba(0,0,0,.4); margin-right: 3px; }
  #nades span { color: rgba(255,255,255,.2); }
  #nades span.on { color: #b6ea6e; }
  #nades svg { width: 17px; height: 17px; }
  /* 탄창 눈금 */
  #magbar { display: flex; justify-content: flex-end; gap: 2px; margin: 4px 0 2px; }
  #magbar i { height: 9px; background: rgba(255,255,255,.16); transform: skewX(-18deg); }
  #magbar i.on { background: #f1f4f7; box-shadow: 0 0 4px rgba(255,255,255,.5); }
  #magbar.low i.on { background: var(--red); box-shadow: 0 0 5px rgba(255,77,61,.8); }

  /* 결과 화면 */
  .rhead { display: flex; gap: 22px; align-items: flex-end; margin: 10px 0 12px; }
  .rhead span { display: block; font-size: 11px; letter-spacing: 2px; color: var(--dim); }
  .rhead b { font-family: var(--num); font-size: 44px; line-height: 1; }
  .rhead .best { margin-left: auto; text-align: right; }
  .rhead .best b { font-size: 18px; color: var(--amber); }
  .rgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .rt { display: grid; grid-template-columns: 30px 1fr; align-items: center; column-gap: 8px; padding: 8px 10px; background: rgba(255,255,255,.05); border: 1px solid var(--line); }
  .rt svg { width: 26px; height: 26px; grid-row: span 2; color: var(--dim); }
  .rt b { font-family: var(--num); font-size: 24px; line-height: 1; }
  .rt span { font-size: 11px; color: var(--dim); }
  .rt.acc svg.ring { width: 30px; height: 30px; color: var(--green); }
  .rt.cr svg, .rt.cr b { color: var(--cyan); }
  .cause { margin-top: 10px; padding: 9px 12px; border-left: 3px solid var(--red); background: rgba(255,77,61,.08); }
  .ctitle { display: flex; align-items: center; gap: 8px; font-size: 15px; margin-bottom: 6px; }
  .ctitle svg { width: 20px; height: 20px; color: #ff8a7a; }
  .ctitle b { color: #ff8a7a; }
  .cbar { display: grid; grid-template-columns: 96px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; color: var(--dim); margin: 3px 0; }
  .cbar i { height: 6px; background: rgba(0,0,0,.45); }
  .cbar u { display: block; height: 100%; background: #ff8a7a; }
  .cbar b { font-family: var(--num); font-size: 14px; color: var(--text); text-align: right; }
  #ovsub .res { display: inline-block; }

  /* 메뉴: 맵 카드 / 난이도 */
  .pick { margin: 8px 0 12px; }
  .pick h6 { margin: 0 0 6px; font-size: 11px; letter-spacing: 2px; color: var(--dim); font-weight: 500; }
  #mapcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #mapcards button { padding: 8px; display: grid; grid-template-columns: 66px 1fr; column-gap: 10px; align-items: center; text-align: left; clip-path: none; }
  #mapcards canvas { width: 66px; height: 66px; grid-row: span 2; border: 1px solid var(--line); }
  #mapcards b { font-size: 15px; align-self: end; }
  #mapcards span { font-size: 11.5px; color: var(--dim); font-weight: 400; align-self: start; }
  #diffseg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #diffseg button { padding: 8px 4px 7px; clip-path: none; display: flex; flex-direction: column; align-items: center; gap: 1px; }
  #diffseg i { display: flex; gap: 1px; height: 18px; color: var(--dim); }
  #diffseg svg { width: 16px; height: 16px; }
  #diffseg b { font-size: 14px; }
  #diffseg span { font-size: 10.5px; color: var(--dim); font-weight: 400; }
  .pick button.on { border-color: var(--amber); background: rgba(255,178,36,.14); box-shadow: inset 0 0 0 1px var(--amber); }
  .pick button.on i { color: var(--amber); }
  /* 순위표 */
  #board .brow { display: grid; grid-template-columns: 24px 1fr auto 70px; align-items: center; gap: 8px; }
  #board em { font-style: normal; font-family: var(--num); font-weight: 700; width: 22px; height: 22px; display: grid; place-items: center; background: rgba(255,255,255,.08); color: var(--dim); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  #board .r1 em { background: #ffb224; color: #11151b; } #board .r2 em { background: #c9d2dc; color: #11151b; } #board .r3 em { background: #c9834a; color: #11151b; }
  #board span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #board small { margin-left: 6px; font-size: 10px; padding: 0 4px; border: 1px solid var(--line); color: var(--dim); }
  #board small.hard { border-color: var(--red); color: #ff8a7a; }
  #board i { font-style: normal; font-family: var(--num); font-size: 13px; color: var(--dim); }
  #board .brow b { display: block; font-family: var(--num); font-size: 16px; text-align: right; color: var(--text); }

  /* ---------- 상점 ---------- */
  #shop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 5;
    background: radial-gradient(ellipse at center, rgba(5,8,13,.55), rgba(5,8,13,.9)); backdrop-filter: blur(5px); }
  #shop.show { display: flex; }
  #shop svg { display: block; }
  .shopbox { width: 1040px; max-width: 96vw; max-height: 97vh; overflow: auto; background: linear-gradient(180deg, rgba(18,24,33,.97), rgba(9,12,18,.97));
    border: 1px solid var(--line); border-top: 3px solid var(--amber); clip-path: var(--cut); padding: 18px 22px 20px; animation: shopIn .22s ease-out; }
  @keyframes shopIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
  .shophead { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .shophead h2 { margin: 0; font-size: 26px; letter-spacing: 4px; }
  #shopwave { font-family: var(--num); font-size: 14px; letter-spacing: 2px; color: var(--amber); padding: 2px 9px; border: 1px solid rgba(255,178,36,.5); }
  .shophead .cred { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 10px; background: rgba(79,216,255,.08); border: 1px solid rgba(79,216,255,.35); }
  .shophead .cred svg { width: 24px; height: 24px; color: var(--cyan); }
  .shophead .cred b { font-family: var(--num); font-size: 30px; line-height: 1; color: var(--cyan); }
  .shophead .cred small { font-size: 11px; color: var(--dim); letter-spacing: 1px; }
  #shopclose { padding: 8px 14px; font-size: 13px; background: rgba(255,255,255,.07); border: 1px solid var(--line); color: var(--text); cursor: pointer; font-family: inherit; }
  #shopclose:hover { background: rgba(255,255,255,.16); }
  #shopbody { display: grid; grid-template-columns: 1.45fr 1fr; gap: 20px; }
  #shopbody h4 { margin: 0 0 9px; font-size: 11px; letter-spacing: 3px; color: var(--amber); display: flex; align-items: baseline; gap: 10px; }
  #shopbody h4 span { letter-spacing: 0; color: var(--dim); font-weight: 400; }
  #shopbody button { font-family: inherit; color: var(--text); cursor: pointer; }
  .price { display: inline-flex; align-items: center; gap: 4px; font-family: var(--num); font-size: 18px; font-weight: 700; color: var(--cyan); }
  .price svg.coin { width: 15px; height: 15px; }
  .price.short { color: #ff8a7a; }
  .lbl { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700; }

  /* 무기 카드 */
  .wgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .wcard { position: relative; padding: 9px 11px 9px; background: rgba(255,255,255,.035); border: 1px solid var(--line); overflow: hidden; }
  .wcard.cur { border-color: rgba(255,178,36,.55); }
  .wtop { display: flex; align-items: flex-start; justify-content: space-between; height: 44px; }
  .wname { font-size: 16px; font-weight: 700; display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .wname b { font-family: var(--num); font-size: 24px; color: var(--amber); line-height: 1; }
  .wname b.zero { color: var(--dim); }
  .wname span { font-size: 10px; letter-spacing: 1px; padding: 1px 6px; background: var(--amber); color: #11151b; font-weight: 700; align-self: center; }
  svg.gun { width: 116px; height: 46px; fill: #c9d2dc; opacity: .9; filter: drop-shadow(0 3px 0 rgba(0,0,0,.5)); margin: -4px -4px 0 0; }
  .wcard.cur svg.gun { fill: #ffd68a; }
  .track { display: flex; gap: 3px; margin: 4px 0 17px; }
  .track u { position: relative; flex: 1; height: 7px; background: rgba(255,255,255,.1); transform: skewX(-18deg); text-decoration: none; }
  .track u.on { background: var(--amber); box-shadow: 0 0 8px rgba(255,178,36,.55); }
  .track u.next { background: rgba(255,178,36,.28); animation: pulse 1.1s ease-in-out infinite; }
  .track u em { position: absolute; top: 9px; left: 50%; transform: translateX(-50%) skewX(18deg); font-style: normal; font-size: 9.5px; color: var(--dim); white-space: nowrap; }
  .track u.on em { color: var(--amber); }
  @keyframes pulse { 50% { background: rgba(255,178,36,.6); } }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; margin-bottom: 5px; }
  .stat { padding: 4px 6px; background: rgba(0,0,0,.3); border-left: 2px solid transparent; }
  .stat label { display: block; font-size: 10px; color: var(--dim); letter-spacing: 1px; }
  .stat b { font-family: var(--num); font-size: 17px; line-height: 1.1; }
  .stat i { display: block; font-style: normal; font-family: var(--num); font-weight: 700; color: var(--green); font-size: 13px; line-height: 1.1; }
  .stat small { font-size: 9.5px; color: var(--dim); margin-left: 2px; font-weight: 400; }
  .stat.up { border-left-color: var(--green); background: rgba(95,224,122,.09); }
  .wcard > button { width: 100%; padding: 7px 10px 6px; background: rgba(255,178,36,.13); border: 1px solid rgba(255,178,36,.6); display: block; }
  .wcard > button:hover:not(:disabled) { background: rgba(255,178,36,.3); }
  .wcard > button small { display: block; font-size: 10.5px; color: var(--dim); margin-top: 3px; }
  .chance { display: block; height: 4px; margin-top: 6px; background: rgba(0,0,0,.5); }
  .chance i { display: block; height: 100%; }
  .chance.hi i { background: var(--green); } .chance.mid i { background: var(--amber); } .chance.lo i { background: var(--red); }
  #shopbody button:disabled { opacity: .4; cursor: default; border-color: var(--line); background: transparent; }
  .wcard.ok { animation: upOk .7s ease-out; border-color: var(--green); }
  .wcard.fail { animation: upFail .45s ease-out; border-color: var(--red); }
  .toast { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-family: var(--num); font-size: 24px; font-weight: 700; letter-spacing: 2px; pointer-events: none; animation: toast 1.1s ease-out forwards; }
  .wcard.ok .toast { color: var(--green); text-shadow: 0 0 16px rgba(95,224,122,.9), 0 2px 3px #000; }
  .wcard.fail .toast { color: #ff8a7a; font-size: 17px; text-shadow: 0 2px 3px #000; }
  @keyframes upOk { 0% { box-shadow: inset 0 0 0 200px rgba(95,224,122,.45); transform: scale(1.03); } 100% { box-shadow: inset 0 0 0 0 rgba(95,224,122,0); transform: none; } }
  @keyframes upFail { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(2px); } }
  @keyframes toast { 0% { opacity: 0; transform: translateY(10px) scale(.8); } 20% { opacity: 1; transform: none; } 75% { opacity: 1; } 100% { opacity: 0; transform: translateY(-14px); } }

  /* 아이템 카드 */
  .icard { display: flex; align-items: center; gap: 12px; padding: 9px 10px; margin-bottom: 8px; background: rgba(255,255,255,.035); border: 1px solid var(--line); --c: var(--green); }
  .icard.shield { --c: var(--cyan); } .icard.strike { --c: #ff7a52; }
  .ibadge { position: relative; flex: none; width: 58px; height: 58px; display: grid; place-items: center; color: var(--c);
    background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--c) 26%, transparent), rgba(0,0,0,.35)); border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); }
  svg.ico { width: 34px; height: 34px; }
  .ibadge kbd { position: absolute; right: -6px; bottom: -6px; font-family: var(--num); font-size: 12px; padding: 0 5px; background: #10151c; border: 1px solid var(--c); color: var(--c); border-radius: 3px; }
  .itext { flex: 1; min-width: 0; }
  .itext h5, .stile h5 { margin: 0; font-size: 15px; font-weight: 700; }
  .itext p { margin: 2px 0 5px; font-size: 12px; color: var(--dim); line-height: 1.4; }
  .own { display: flex; align-items: center; gap: 3px; }
  .own u { width: 16px; height: 5px; background: rgba(255,255,255,.12); text-decoration: none; }
  .own u.on { background: var(--c); box-shadow: 0 0 6px var(--c); }
  .own span { margin-left: 6px; font-family: var(--num); font-size: 13px; color: var(--dim); }
  .icard > button { flex: none; min-width: 96px; padding: 9px 8px; background: rgba(79,216,255,.1); border: 1px solid rgba(79,216,255,.5); }
  .icard > button:hover:not(:disabled) { background: rgba(79,216,255,.25); }

  /* 보급 타일 */
  .sgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stile h5 { font-size: 13px; }
  .fx { display: grid; gap: 2px; margin-bottom: 7px; }
  .fx span { display: flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--dim); padding: 3px 6px; background: rgba(0,0,0,.28); border-left: 2px solid transparent; }
  .fx b { font-family: var(--num); font-size: 13px; color: var(--dim); }
  .fx span.on { color: var(--text); border-left-color: var(--amber); background: rgba(255,178,36,.1); }
  .fx span.on b { color: var(--amber); }
  .fx span.next { border-left-color: var(--green); color: var(--text); }
  .fx span.next b { color: var(--green); }
  .stile { position: relative; padding: 10px 6px 8px; text-align: center; background: rgba(255,255,255,.035); border: 1px solid var(--line); --c: #ffc83c; }
  .stile.rocket { --c: #ff7a52; } .stile.reroll { --c: #4fd8ff; } .stile.rare { --c: #ffb224; }
  .stile svg.ico { margin: 0 auto 5px; color: var(--c); }
  .stile p { margin: 2px 0 6px; font-size: 10px; color: var(--dim); line-height: 1.35; min-height: 40px; }
  .stile em { position: absolute; top: 5px; right: 6px; font-style: normal; font-family: var(--num); font-size: 11.5px; color: var(--dim); }
  .stile:hover:not(:disabled) { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
  .note { font-size: 12px; color: var(--dim); margin: 10px 0 0; line-height: 1.5; }
  @media (max-width: 860px) { #shopbody { grid-template-columns: 1fr; } }

  #perklist { margin-top: 9px; max-width: 330px; display: flex; flex-wrap: wrap; gap: 4px; }
  #perklist span { font-size: 11px; padding: 2px 7px; background: rgba(8,12,18,.6); border: 1px solid var(--line); border-radius: 2px; color: var(--dim); text-shadow: none; }
  #perklist span.rare { border-color: rgba(255,178,36,.7); color: var(--amber); }

  /* ---------- 우측 하단: 무기 ---------- */
  #ammo { position: absolute; right: 24px; bottom: 20px; text-align: right; }
  #nades { display: flex; justify-content: flex-end; align-items: center; gap: 2px; font-size: 12px; color: var(--dim); margin-bottom: 2px; }
  #nades i { width: 9px; height: 13px; border-radius: 3px 3px 4px 4px; border: 1px solid var(--line); background: rgba(0,0,0,.45); }
  #nades i.on { background: #9fd65a; border-color: #c9f08f; }
  #wname { font-size: 13px; letter-spacing: 3px; color: var(--amber); font-weight: 700; }
  #ammotext { font-family: var(--num); font-size: 62px; font-weight: 700; line-height: .95; }
  #ammotext small { font-size: 26px; color: var(--dim); font-weight: 600; }
  #ammotext.low { color: var(--red); }
  #reloadtext { font-size: 14px; color: var(--amber); min-height: 20px; font-weight: 700; }
  #wlist { margin-top: 4px; display: flex; justify-content: flex-end; gap: 4px; }
  #wlist span { font-size: 12px; padding: 3px 7px; background: rgba(8,12,18,.55); border: 1px solid var(--line); color: var(--dim); display: flex; gap: 5px; align-items: center; text-shadow: none; }
  #wlist span.on { background: var(--amber); border-color: var(--amber); color: #11151b; font-weight: 700; }
  #wlist span.on kbd { border-color: rgba(0,0,0,.4); color: #11151b; background: transparent; }

  /* ---------- 힌트 / 특성 ---------- */
  #hint { position: absolute; left: 50%; bottom: 104px; transform: translateX(-50%); max-width: 640px; padding: 9px 18px 9px 16px; font-size: 15px; text-align: center;
    background: var(--panel); border-left: 3px solid var(--amber); opacity: 0; transition: opacity .4s; }
  #hint.show { opacity: 1; }
  #perks { position: absolute; left: 0; right: 0; bottom: 25%; display: none; justify-content: center; gap: 16px; }
  #perks.show { display: flex; }
  .perk { width: 220px; padding: 16px 16px 18px; background: rgba(8,12,18,.86); border: 1px solid var(--line); border-top: 3px solid #7f8a96; clip-path: var(--cut); text-align: left; animation: perkIn .3s both; }
  .perk:nth-child(2) { animation-delay: .06s; } .perk:nth-child(3) { animation-delay: .12s; }
  .perk.rare { border-color: rgba(255,178,36,.55); border-top-color: var(--amber); background: linear-gradient(180deg, rgba(60,40,6,.9), rgba(8,12,18,.88) 55%); }
  .perk.rare h3 { color: var(--amber); }
  .perk .tier { float: right; font-size: 11px; letter-spacing: 2px; color: var(--dim); }
  .perk.rare .tier { color: var(--amber); }
  .perk kbd { display: inline-block; font-family: var(--num); font-size: 17px; line-height: 1; padding: 3px 9px; border: 1px solid var(--amber); color: var(--amber); border-radius: 3px; }
  .perk h3 { margin: 12px 0 4px; font-size: 19px; }
  .perk p { margin: 0; font-size: 13.5px; color: var(--dim); line-height: 1.5; }
  @keyframes perkIn { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  #perkbar { position: absolute; left: 50%; bottom: calc(25% - 16px); width: 692px; max-width: 80vw; height: 3px; transform: translateX(-50%); background: rgba(0,0,0,.5); display: none; }
  #perkbarfill { height: 100%; width: 100%; background: var(--amber); }
  #resume.wait button { opacity: .45; pointer-events: none; }
  #perkhint { position: absolute; left: 0; right: 0; bottom: calc(25% + 214px); text-align: center; font-size: 15px; color: var(--dim); display: none; }

  /* ---------- 피해 숫자 ---------- */
  #dmglayer { position: absolute; inset: 0; overflow: hidden; }
  .dmgnum { position: absolute; left: -12px; top: -10px; font-family: var(--num); font-size: 20px; font-weight: 700; color: #fff; will-change: transform; text-shadow: 0 0 3px #000, 0 1px 2px #000; }
  .dmgnum.head { color: var(--amber); font-size: 25px; }
  .dmgnum.kill { color: var(--red); font-size: 28px; }

  /* ---------- 메뉴 ---------- */
  #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 0 7vw;
    background: linear-gradient(90deg, rgba(5,8,13,.94) 0%, rgba(5,8,13,.8) 42%, rgba(5,8,13,.4) 100%); }
  #overlay.hidden { display: none; }
  .panel { width: 460px; max-width: 46vw; }
  .logo { font-family: var(--num); font-weight: 700; font-size: clamp(54px, 10vh, 84px); line-height: .86; letter-spacing: 3px; margin: 0; }
  .logo em { font-style: normal; color: var(--amber); display: block; }
  .logo::after { content: ""; display: block; width: 74px; height: 4px; background: var(--amber); margin-top: 14px; }
  #ovsub { font-size: 17px; margin: 14px 0 18px; line-height: 1.7; min-height: 28px; color: var(--text); }
  #ovsub .res { font-size: 30px; letter-spacing: 2px; }
  #ovsub .rec { margin-left: 12px; padding: 2px 10px; font-size: 13px; letter-spacing: 2px; background: var(--amber); color: #11151b; vertical-align: middle; }
  #ovsub small { font-size: 13px; color: var(--dim); }
  .field { display: flex; gap: 10px; margin: 10px 0; }
  .field[hidden] { display: none; }
  .field > label { flex: 1; display: flex; flex-direction: column; gap: 5px; font-size: 11px; letter-spacing: 2px; color: var(--dim); }
  .panel select, .panel input[type=text] { padding: 10px 12px; font-size: 15px; border: 1px solid var(--line); border-radius: 0; background: rgba(255,255,255,.06); color: var(--text); font-family: inherit; outline: none; min-width: 0; }
  .panel select:focus, .panel input[type=text]:focus { border-color: var(--amber); }
  .panel select option { background: #10151c; }
  .panel button { padding: 13px 22px; font-size: 16px; font-weight: 700; border: 1px solid var(--line); cursor: pointer; background: rgba(255,255,255,.07); color: var(--text); font-family: inherit; clip-path: var(--cut); transition: background .15s, transform .1s; }
  .panel button:hover { background: rgba(255,255,255,.16); }
  .panel button:active { transform: translateY(1px); }
  .panel button.primary { background: var(--amber); border-color: var(--amber); color: #11151b; font-size: 18px; letter-spacing: 1px; }
  .panel button.primary:hover { background: #ffc85a; }
  .wide { width: 100%; margin: 6px 0 10px; }
  .sect { font-size: 11px; letter-spacing: 3px; color: var(--amber); margin: 14px 0 6px; display: flex; align-items: center; gap: 10px; }
  .sect::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  #err { color: #ff8a7a; font-size: 13px; min-height: 18px; }
  .sliders { display: grid; grid-template-columns: auto 1fr 38px; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--dim); }
  .sliders span { font-family: var(--num); font-size: 15px; color: var(--text); text-align: right; }
  .sliders select { padding: 5px 8px; font-size: 13px; }
  input[type=range] { width: 100%; accent-color: var(--amber); }

  .side { width: 340px; max-width: 32vw; display: flex; flex-direction: column; gap: 12px; }
  .side select { padding: 5px 8px; font-size: 13px; border: 1px solid var(--line); background: rgba(255,255,255,.06); color: var(--text); font-family: inherit; }
  .side select option { background: #10151c; }
  .card { background: var(--panel); border: 1px solid var(--line); padding: 12px 16px; clip-path: var(--cut); }
  .card h4 { margin: 0 0 9px; font-size: 11px; letter-spacing: 3px; color: var(--amber); font-weight: 700; }
  #board:empty::before { content: "아직 기록이 없습니다"; color: var(--dim); font-size: 13px; }
  #board div { font-size: 13px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,.07); color: var(--text); }
  /* 조작 안내: 키보드·마우스 그림 */
  .pad { display: flex; gap: 10px; align-items: flex-start; }
  .kb { flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .krow { display: flex; gap: 3px; }
  .krow i { flex: 1; min-width: 0; height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-style: normal;
    font-family: var(--num); font-weight: 700; font-size: 13px; line-height: 1; color: var(--text); border: 1px solid var(--c, var(--line)); border-bottom-width: 3px; border-radius: 4px;
    background: color-mix(in srgb, var(--c, #fff) 16%, transparent); }
  .krow i small { font-family: "Noto Sans KR", sans-serif; font-weight: 500; font-size: 9px; margin-top: 3px; color: var(--c); white-space: nowrap; }
  .krow i.off { border-color: rgba(255,255,255,.07); background: transparent; }
  .move { --c: #ffb224; } .dash { --c: #5fe07a; } .gun { --c: #ff8a7a; } .item { --c: #4fd8ff; } .team { --c: #c79bff; } .sys { --c: #9aa6b2; }
  svg.mouse { width: 62px; height: 115px; margin-top: 2px; }
  svg.mouse text { font-size: 10px; fill: #c9d2dc; font-family: "Noto Sans KR", sans-serif; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 9px; font-size: 11px; color: var(--dim); }
  .legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; margin-right: 5px; background: var(--c); border-radius: 2px; vertical-align: -1px; }

  /* 일시정지 패널 */
  #overlay.m-pause .logo { font-size: 30px; line-height: 1; letter-spacing: 2px; display: flex; gap: 8px; opacity: .75; }
  #overlay.m-pause .logo em { display: inline; }
  #overlay.m-pause .logo::after { display: none; }
  .ptitle { display: flex; align-items: center; gap: 14px; margin: 6px 0 4px; }
  .ptitle .pbars { display: flex; gap: 7px; }
  .ptitle .pbars i { width: 9px; height: 34px; background: var(--amber); }
  .ptitle b { font-size: 34px; letter-spacing: 3px; }
  .pnote { font-size: 13px; color: var(--dim); margin-bottom: 12px; min-height: 18px; }
  .pnote.warn { color: #ff8a7a; }
  .php { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 8px; margin: 10px 0 8px; }
  .php svg { width: 20px; height: 20px; color: var(--green); }
  .php .bar { height: 9px; background: rgba(0,0,0,.5); border: 1px solid var(--line); transform: skewX(-18deg); overflow: hidden; }
  .php .bar u { display: block; height: 100%; background: var(--green); }
  .php b { font-family: var(--num); font-size: 18px; }
  .pguns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .pguns div { position: relative; padding: 6px 6px 4px; background: rgba(255,255,255,.05); border: 1px solid var(--line); text-align: center; font-size: 11px; color: var(--dim); }
  .pguns div.on { border-color: var(--amber); }
  .pguns svg { width: 100%; height: 26px; fill: #c9d2dc; margin: 0 0 2px; filter: none; }
  .pguns em { position: absolute; right: 4px; top: 1px; font-style: normal; font-family: var(--num); font-weight: 700; font-size: 13px; color: var(--amber); }
  .pguns span { font-family: var(--num); font-size: 12px; color: var(--text); }
  .prow { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; align-items: center; }
  .prow > span { position: relative; width: 30px; height: 30px; display: grid; place-items: center; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--text); }
  .prow > span.rare { border-color: rgba(255,178,36,.7); color: var(--amber); }
  .prow > span.it { color: var(--c); border-color: color-mix(in srgb, var(--c) 55%, transparent); }
  .prow > span.none { opacity: .35; }
  .prow svg { width: 19px; height: 19px; }
  .prow b { position: absolute; right: -4px; bottom: -5px; font-family: var(--num); font-size: 12px; padding: 0 3px; background: #11151b; border: 1px solid var(--line); line-height: 1.1; color: var(--text); }
  .prow label { font-size: 11px; letter-spacing: 1px; color: var(--dim); margin-right: 4px; width: 36px; }
  @media (max-width: 900px) { .side .card:last-child { display: none; } }

  /* ---------- 판 사이 성장 (사이클 11) ---------- */
  #players:empty + #ach { top: 16px; }
  #ach { position: absolute; left: 16px; top: 124px; display: flex; align-items: center; gap: 10px; padding: 8px 14px 8px 10px; min-width: 240px;
    background: rgba(8,12,18,.78); border-left: 3px solid var(--amber); opacity: 0; transform: translateX(-16px); transition: opacity .25s, transform .25s; pointer-events: none; }
  #ach.show { opacity: 1; transform: none; }
  #ach svg { width: 26px; height: 26px; color: var(--amber); }
  #ach small { display: block; font-size: 10px; letter-spacing: 2px; color: var(--amber); }
  #ach b { display: block; font-size: 15px; }
  #ach span { display: block; font-size: 11.5px; color: var(--dim); }
  #ach em { margin-left: auto; font-style: normal; font-family: var(--num); font-weight: 700; color: var(--amber); }
  #overlay.m-over .side .card:not(#progcard) { display: none; }
  #overlay.m-pause #progcard { display: none; }
  #progcard h5 { margin: 12px 0 6px; font-size: 11px; letter-spacing: 2px; color: var(--dim); font-weight: 500; display: flex; justify-content: space-between; }
  #progcard .rank { display: flex; align-items: center; gap: 10px; }
  #progcard .rank em { font-style: normal; font-family: var(--num); font-weight: 700; font-size: 20px; width: 38px; height: 38px; display: grid; place-items: center;
    background: var(--amber); color: #11151b; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
  #progcard .rank b { display: block; font-size: 16px; }
  #progcard .rank small { font-size: 11.5px; color: var(--dim); font-family: var(--num); }
  #progcard .rank .up { margin-left: auto; font-style: normal; font-size: 11px; font-weight: 700; padding: 2px 7px; background: var(--green); color: #11151b; animation: upPulse 1.2s ease-out; }
  @keyframes upPulse { 0% { transform: scale(1.5); opacity: 0; } 40% { transform: scale(1); opacity: 1; } }
  .xpbar { height: 8px; margin: 8px 0 4px; background: rgba(0,0,0,.45); }
  .xpbar u { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #ffb224, #ffd27a); box-shadow: 0 0 8px rgba(255,178,36,.5); transition: width 1.1s cubic-bezier(.2,.8,.2,1); }
  .xprow { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .xprow div { display: flex; justify-content: space-between; }
  .xprow b { font-family: var(--num); color: var(--text); }
  .xprow .rec b { color: var(--green); }
  .xprow .sum { grid-column: span 2; border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; font-size: 13px; color: var(--text); }
  .xprow .sum b { color: var(--amber); font-size: 16px; }
  .medals { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .medal { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; font-size: 12px; border: 1px solid rgba(255,178,36,.5); background: rgba(255,178,36,.1); }
  .medal svg { width: 14px; height: 14px; color: var(--amber); }
  .medal em { font-style: normal; font-family: var(--num); color: var(--amber); }
  .nextu { display: flex; align-items: center; gap: 8px; margin-top: 9px; font-size: 12.5px; color: var(--dim); }
  .nextu svg { width: 16px; height: 16px; color: var(--amber); }
  .nextu b { color: var(--text); font-weight: 600; }
  .mast { display: grid; grid-template-columns: 54px 1fr; align-items: center; column-gap: 8px; margin-top: 8px; font-size: 12px; color: var(--dim); }
  .mast svg { width: 54px; height: 18px; grid-row: span 2; color: var(--text); }
  .mast i, .ach i { display: block; height: 4px; background: rgba(0,0,0,.45); margin-top: 3px; }
  .mast u, .ach u { display: block; height: 100%; background: var(--cyan); }
  .ach { display: grid; grid-template-columns: 1fr 80px; column-gap: 10px; align-items: center; margin: 5px 0; font-size: 13px; }
  .ach span small { display: block; font-size: 11px; color: var(--dim); }
  .ach i { grid-column: 1; }
  .ach b { grid-column: 2; grid-row: 1 / span 2; font-family: var(--num); font-size: 13px; text-align: right; color: var(--dim); }
  .slot { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin: 4px 0; font-size: 12px; }
  .slot label { width: 52px; color: var(--dim); }
  .slot.lock { color: var(--dim); opacity: .7; padding: 4px 0; }
  .slot button { padding: 4px 8px; font-size: 11.5px; border: 1px solid var(--line); background: rgba(255,255,255,.05); color: var(--text); font-family: inherit; cursor: pointer; }
  .slot button.on { border-color: var(--amber); background: rgba(255,178,36,.18); color: var(--amber); }
  .slot button:disabled { opacity: .35; cursor: default; }
  .advice { display: flex; gap: 8px; margin-top: 8px; padding: 8px 12px; border-left: 3px solid var(--cyan); background: rgba(79,216,255,.07); font-size: 13px; }
  .advice svg { width: 18px; height: 18px; color: var(--cyan); flex: none; }
  .advice b { display: block; font-size: 11px; letter-spacing: 1px; color: var(--cyan); }
  #overlay.vet:not(.m-over):not(.m-pause) .side .card:last-child { display: none; }   /* 돌아온 사람: 조작표 대신 진행 */
  .kit .slot select { flex: 1; padding: 4px 6px; font-size: 12px; }
  .slot.lock span { font-size: 12px; }
  #nextgoal { margin-top: 8px; font-size: 13px; color: var(--dim); }
  #nextgoal b { color: var(--amber); }

  /* ---------- 보관함 (사이클 12) ---------- */
  #vault { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; background: rgba(5,8,13,.82); backdrop-filter: blur(4px); }
  #vault[hidden] { display: none; }
  .vbox { width: min(1120px, 94vw); height: min(640px, 92vh); display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--amber); clip-path: var(--cut); padding: 14px 20px 16px; }
  .vhead { display: flex; align-items: center; gap: 16px; margin-bottom: 10px; }
  .vhead > b { font-size: 20px; letter-spacing: 2px; }
  .vhead nav { display: flex; gap: 4px; }
  .vhead nav button, .vclose, .mini, .chip, .wrow, .cell, .tog { font-family: inherit; color: var(--text); background: rgba(255,255,255,.05); border: 1px solid var(--line); cursor: pointer; }
  .vhead nav button { padding: 6px 14px; font-size: 14px; position: relative; }
  .vhead nav button.on { border-color: var(--amber); background: rgba(255,178,36,.15); color: var(--amber); }
  .vhead kbd { font-family: var(--num); font-size: 11px; color: var(--dim); margin-right: 6px; }
  .vhead .new, #progcard .new { font-style: normal; font-size: 10px; font-weight: 700; background: var(--red); color: #fff; padding: 0 5px; margin-left: 6px; border-radius: 8px; }
  .vcount { margin-left: auto; font-size: 12px; color: var(--dim); font-family: var(--num); }
  .vclose { padding: 6px 12px; font-size: 13px; }
  .vbody { flex: 1; min-height: 0; overflow: auto; }
  .vnote { font-size: 12.5px; color: var(--dim); margin-bottom: 10px; }
  .vnote b { color: var(--text); font-weight: 600; }
  .vcols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; min-height: 0; }
  .vdetail h5 { margin: 10px 0 6px; font-size: 12px; letter-spacing: 1px; color: var(--amber); display: flex; justify-content: space-between; }
  .vdetail h5 small { color: var(--dim); font-weight: 400; letter-spacing: 0; }
  .vdetail h5:first-child { margin-top: 0; }
  .vdetail p { margin: 4px 0; font-size: 13px; } .vdetail p.dim { color: var(--dim); }
  .vlist { display: flex; flex-direction: column; gap: 6px; }
  .wrow { display: grid; grid-template-columns: 150px 1fr; grid-template-rows: auto auto; column-gap: 12px; align-items: center; padding: 8px 12px; text-align: left; }
  .wrow .gunsil { grid-row: span 2; } .wrow b { font-size: 15px; } .wrow small { color: var(--dim); font-size: 12px; }
  .wrow.on { border-color: var(--amber); background: rgba(255,178,36,.1); }
  .gunsil svg { width: 140px; height: 56px; fill: currentColor; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 5px; font-size: 12px; }
  .chip i { width: 16px; height: 16px; border: 1px solid rgba(255,255,255,.3); }
  .chip.on { border-color: var(--amber); background: rgba(255,178,36,.16); }
  .g-rare { border-color: rgba(79,216,255,.55) !important; } .g-legend { border-color: rgba(255,178,36,.8) !important; box-shadow: 0 0 8px rgba(255,178,36,.25); }
  .mini { margin-top: 6px; padding: 4px 10px; font-size: 12px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; align-content: start; }
  .cell { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 4px 7px; font-size: 11.5px; }
  .cell i { width: 34px; height: 22px; border: 1px solid rgba(255,255,255,.25); display: grid; place-items: center; }
  .cell i.ttl { border: none; } .cell i.ttl svg { width: 22px; height: 22px; color: var(--amber); }
  .cell.no { opacity: .55; } .cell.no i.ttl svg { color: var(--dim); }
  .cell.on { background: rgba(255,178,36,.12); }
  .cell em { position: absolute; top: 2px; right: 3px; font-style: normal; font-size: 9px; font-weight: 700; color: #fff; background: var(--red); padding: 0 3px; }
  .achgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px 18px; }
  .achgrid h5 { margin: 8px 0 4px; font-size: 12px; color: var(--amber); } .achgrid h5 small { color: var(--dim); font-weight: 400; }
  .arow { display: grid; grid-template-columns: 20px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; opacity: .5; }
  .arow.got { opacity: 1; } .arow svg { width: 18px; height: 18px; color: var(--dim); } .arow.got svg { color: var(--amber); }
  .arow small { display: block; font-size: 11px; color: var(--dim); } .arow em { font-style: normal; font-size: 11px; color: var(--dim); font-family: var(--num); }
  .vlist2 { display: flex; flex-direction: column; gap: 6px; }
  .prow2 { display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center; padding: 7px 10px; background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 13px; }
  .prow2 svg { width: 26px; height: 26px; color: var(--amber); } .prow2.locked { opacity: .55; } .prow2.locked svg { color: var(--dim); }
  .prow2 small { display: block; font-size: 11.5px; color: var(--dim); } .prow2 em { font-style: normal; font-size: 11.5px; color: var(--dim); }
  .wtag { font-style: normal; font-size: 10px; margin-left: 6px; padding: 0 5px; border: 1px solid var(--line); color: var(--dim); } .wtag.rare { color: var(--amber); border-color: rgba(255,178,36,.5); }
  .tog { padding: 4px 10px; font-size: 12px; } .tog.on { border-color: var(--green); color: var(--green); }
  .mrow { display: grid; grid-template-columns: 74px 54px 1fr; grid-template-rows: auto auto auto; column-gap: 8px; align-items: center; margin-bottom: 8px; font-size: 12.5px; }
  .mrow .gunsil { grid-row: span 3; } .mrow .gunsil svg { width: 70px; height: 28px; fill: #8a919b; }
  .mrow i { grid-column: 2 / span 2; display: block; height: 4px; background: rgba(0,0,0,.45); } .mrow u { display: block; height: 100%; background: var(--cyan); }
  .mrow small { grid-column: 2 / span 2; font-size: 11px; color: var(--dim); }
  .perk.spec { border-color: rgba(79,216,255,.6) !important; } .perk.spec .tier { background: var(--cyan) !important; color: #11151b !important; }
  #ach.g-rare { border-left-color: var(--cyan); } #ach.g-legend { border-left-color: #ffd27a; box-shadow: 0 0 18px rgba(255,178,36,.35); }
  .medal.drop { border-color: rgba(79,216,255,.5); background: rgba(79,216,255,.08); } .medal.drop svg { color: var(--cyan); }
  .vaultbtn { margin-top: 10px; width: 100%; padding: 7px; font-family: inherit; font-size: 13px; font-weight: 700; color: var(--text); background: rgba(255,178,36,.12); border: 1px solid rgba(255,178,36,.5); cursor: pointer; }
  .vaultbtn:hover { background: rgba(255,178,36,.22); }
  .kitsum { font-size: 12px; color: var(--dim); margin-top: 6px; } .kitsum b { color: var(--text); font-weight: 600; }
  #players .ttl { font-size: 10px; color: var(--amber); margin-right: 5px; letter-spacing: 1px; }
</style>

{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</script>
</head>
<body>
<div id="hud" class="hidden">
  <div id="hurt"></div>
  <div id="scope"><i></i></div>
  <div id="dmglayer"></div>
  <div id="hurtdir"></div>
  <div id="cross"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="dot"></i></div>
  <svg id="hitmark" width="34" height="34"><line x1="4" y1="4" x2="12" y2="12"/><line x1="30" y1="4" x2="22" y2="12"/><line x1="4" y1="30" x2="12" y2="22"/><line x1="30" y1="30" x2="22" y2="22"/></svg>
  <div id="top"></div>
  <div id="combo"></div>
  <div id="prompt"><span id="prompttext"></span><div><div id="promptfill"></div></div></div>
  <div id="buff"></div>
  <div id="markers"><i></i><i></i><i></i></div>
  <div id="bossbar"><span id="bossico"></span><span id="bossname">BOSS</span><div><div id="bossfill"></div></div></div>
  <div id="banner"><b></b><span></span></div>
  <div id="mapwrap"><canvas id="minimap" width="170" height="170"></canvas></div>
  <div id="feed"></div>
  <div id="players"></div>
  <div id="ach"></div>
  <div id="hint"></div>
  <div id="inter"></div>
  <div id="actmsg"></div>
  <div id="perkhint">특성을 선택하세요 (숫자 키 1 · 2 · 3)</div>
  <div id="perks"></div>
  <div id="perkbar"><div id="perkbarfill"></div></div>
  <div id="stats">
    <div id="hpbox"><label id="hpico"></label><span id="hptext">100</span></div>
    <div id="hpbar"><div id="hpfill"></div></div>
    <div id="dash"><span id="dashico"></span><kbd>Q</kbd><div id="dashbar"><div id="dashfill"></div></div></div>
    <div id="items"></div>
    <div id="perklist"></div>
  </div>
  <div id="ammo">
    <div id="nades"></div>
    <div id="wname"></div>
    <div id="ammotext"></div>
    <div id="magbar"></div>
    <div id="reloadtext"></div>
    <div id="wlist"></div>
  </div>
</div>

<div id="shop">
  <div class="shopbox">
    <div class="shophead"><h2>상점</h2><span id="shopwave"></span><span id="shoptime"></span>
      <span class="cred"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 8.6A4.6 4.6 0 1 0 15.5 15.4M12 5v3M12 16v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><b id="shopcred">0</b><small>크레딧</small></span>
      <button id="shopclose">닫기 (B)</button></div>
    <div id="shopbody"></div>
  </div>
</div>

<div id="overlay">
  <div class="panel">
    <h1 class="logo">FPS<em>ARENA</em></h1>
    <div id="ovsub">웨이브를 버티고 보스를 쓰러뜨리세요</div>
    <div id="menu">
      <div class="pick"><h6>맵</h6><div id="mapcards"></div></div>
      <div class="pick"><h6>난이도</h6><div id="diffseg"></div></div>
      <div class="field" hidden>
        <label>맵<select id="map"><option value="arena">요새 광장</option><option value="depot">창고 지구</option></select></label>
        <label>난이도<select id="diff"><option value="easy">쉬움</option><option value="normal">보통</option><option value="hard">어려움 (점수 ×1.5)</option></select></label>
      </div>
      <button id="btnSolo" class="primary wide">솔로 플레이</button>
      <div class="sect">협동</div>
      <div class="field">
        <label>닉네임<input id="inName" type="text" maxlength="16" placeholder="Player"></label>
        <label>방 이름<input id="inRoom" type="text" maxlength="32" value="default"></label>
      </div>
      <button id="btnMulti" class="wide" style="margin-bottom:4px">협동 참가</button>
      <div id="err"></div>
    </div>
    <div id="resume" style="display:none">
      <div class="field"><button id="btnResume" class="primary" style="flex:1">계속하기</button><button id="btnQuit" style="flex:1">메인 메뉴</button></div>
      <div id="nextgoal"></div>
    </div>
  </div>

  <div class="side">
    <div class="card" id="progcard"></div>
    <div class="card"><h4>순위표</h4><div id="board"></div></div>
    <div class="card"><h4>설정</h4>
    <div class="sliders">
      <label for="sens">마우스 감도</label><input id="sens" type="range" min="0.2" max="3" step="0.05"><span id="sensval"></span>
      <label for="fov">시야각</label><input id="fov" type="range" min="60" max="100" step="1"><span id="fovval"></span>
      <label for="vol">음량</label><input id="vol" type="range" min="0" max="1" step="0.05"><span id="volval"></span>
      <label for="gfx">그래픽</label><select id="gfx"><option value="high">높음 (빛 번짐 효과)</option><option value="low">낮음 (성능 우선)</option></select><span></span>
    </div></div>
    <div class="card">
      <h4>조작</h4>
      <div class="pad">
        <div class="kb">
          <div class="krow"><i class="sys">Esc<small>정지</small></i><i class="gun">1<small>소총</small></i><i class="gun">2<small>샷건</small></i><i class="gun">3<small>저격</small></i><i class="gun">4<small>권총</small></i><i class="gun">5<small>로켓</small></i></div>
          <div class="krow"><i class="off"></i><i class="dash">Q<small>대시</small></i><i class="move">W<small>▲</small></i><i class="gun">E<small>교체</small></i><i class="gun">R<small>장전</small></i><i class="item">T<small>폭격</small></i></div>
          <div class="krow"><i class="off"></i><i class="move">A<small>◀</small></i><i class="move">S<small>▼</small></i><i class="move">D<small>▶</small></i><i class="team">F<small>부활</small></i><i class="gun">G<small>수류탄</small></i></div>
          <div class="krow"><i class="move">Shift<small>달리기</small></i><i class="item">Z<small>주사</small></i><i class="item">X<small>방어막</small></i><i class="move">C<small>앉기</small></i><i class="team">V<small>표시</small></i><i class="team">B<small>상점</small></i></div>
          <div class="krow"><i class="off"></i><i class="move" style="flex:3.2">Space<small>점프</small></i><i class="sys" style="flex:1.9">Enter<small>다음</small></i></div>
        </div>
        <svg class="mouse" viewBox="0 0 70 130" aria-hidden="true">
          <rect x="6" y="20" width="58" height="104" rx="27" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.3)" stroke-width="2"/>
          <path d="M8 62V47c0-15 12-27 27-27v42z" fill="rgba(255,77,61,.45)" stroke="#ff8a7a" stroke-width="1.5"/>
          <path d="M62 62V47c0-15-12-27-27-27v42z" fill="rgba(255,178,36,.4)" stroke="#ffb224" stroke-width="1.5"/>
          <rect x="30" y="32" width="10" height="20" rx="5" fill="#11151b" stroke="#c9d2dc" stroke-width="1.5"/>
          <text x="20" y="13" text-anchor="middle">사격</text><text x="52" y="13" text-anchor="middle">조준</text>
          <text x="35" y="84" text-anchor="middle">휠 교체</text><text x="35" y="100" text-anchor="middle">클릭 표시</text>
        </svg>
      </div>
      <div class="legend"><span class="move">이동</span><span class="dash">회피</span><span class="gun">전투</span><span class="item">아이템</span><span class="team">상점·협동</span></div>
    </div>
  </div>
</div>

<div id="vault" hidden></div>

<script type="module" src="js/main.js"></script>

</html>
